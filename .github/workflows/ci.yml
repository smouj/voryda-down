name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore AreaDown.sln
      - name: Build
        run: dotnet build AreaDown.sln -c Release --no-restore
      - name: Test
        run: dotnet test AreaDown.sln -c Release --no-build
